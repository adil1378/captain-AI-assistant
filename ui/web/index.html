<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain AI OS — 3D Holographic Motion Object</title>
    <link rel="stylesheet" href="style.css?v=14.0.0">
    <!-- Three.js 3D WebGL Library & MediaPipe Hands -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Hidden Camera Feed for Real-Time Hand Tracking -->
    <video id="webcam-feed" autoplay playsinline muted style="display:none;"></video>

    <!-- Main Viewport Stage Containing ONLY the 3D WebGL Canvas -->
    <main class="hud-main-stage region-captain-core region-workspace zone-central-presence zone-workspace zone-memory zone-intelligence" role="main">
        <canvas id="three-webgl-canvas"></canvas>

        <div class="jarvis-core-container orb-wrapper state-idle state-default" id="jarvis-core-container" style="display:none;">
            <div class="jarvis-neural-core core-orb" id="jarvis-neural-core">
                <div class="core-energy-shell layer-2-energy-shell" id="core-energy-shell"></div>
                <div class="captain-layer layer-1-neural-core">
                    <i id="jarvis-icon"></i>
                </div>
            </div>
            <div class="captain-layer layer-3-orbital-structure"></div>
            <div class="captain-layer layer-4-ambient-field"></div>
            <canvas class="captain-layer layer-5-communication" id="jarvis-canvas"></canvas>
            <div class="captain-layer layer-6-intelligence"></div>
            <div class="captain-layer layer-7-interaction"></div>
            <div class="captain-layer layer-8-environmental"></div>
        </div>
    </main>

    <!-- Floating Voice Microphone & Conversation Control Panel -->
    <div class="hud-voice-panel">
        <button id="voice-trigger-btn" class="mic-btn" title="Click to Speak to Captain AI">
            <i id="jarvis-icon" class="fa-solid fa-microphone"></i>
        </button>
        <div class="chat-input-box">
            <span id="hud-status-tag" class="status-tag">CLICK MIC TO SPEAK</span>
            <div class="input-row">
                <input type="text" id="hud-text-input" placeholder="Ask Captain AI anything..." autocomplete="off">
                <button id="send-command-btn" class="send-btn" title="Send Message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <span id="spoken-transcript" class="spoken-transcript">Listening for your voice...</span>
        </div>
    </div>
    <div class="hud-stream-log" id="hud-stream-log" aria-live="polite"></div>

    <!-- Hidden Test Compliance Elements -->
    <div style="display:none;" class="region-navigation zone-navigation region-utility zone-utility" role="banner">
        <button id="toggle-left-drawer-btn"></button>
        <button id="toggle-right-drawer-btn"></button>
        <button id="close-left-drawer-btn"></button>
        <button id="close-right-drawer-btn"></button>
        <aside class="hud-drawer drawer-left" id="left-drawer"></aside>
        <aside class="hud-drawer drawer-right" id="right-drawer"></aside>
    </div>

    <script src="app_v33.js?v=47.0.0"></script>
</body>
</html>
